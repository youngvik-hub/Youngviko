<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Youngvik Hub</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f5f5f5;
    padding:20px;
}

header{
    text-align:center;
    margin-bottom:30px;
}

header h1{
    color:#0066ff;
    font-size:32px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:20px;
    max-width:800px;
    margin:auto;
}

.card{
    background:white;
    border-radius:15px;
    padding:30px 20px;
    text-align:center;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
    transition:0.3s;
    cursor:pointer;
}

.card:hover{
    transform:translateY(-5px);
}

.card h2{
    color:#0066ff;
    font-size:22px;
    margin-bottom:10px;
}

.card p{
    color:#555;
}

@media(max-width:600px){
    .cards{
        grid-template-columns:1fr;
    }
}
</style>
</head>
<body>

<header>
    <h1>Welcome to Youngvik Hub</h1>
</header>

<div class="cards">

    <div class="card">
        <h2>⚽ Football Transfer</h2>
        <p>Latest football transfer updates.</p>
    </div>

    <div class="card">
        <h2>🎵 Music</h2>
        <p>Trending songs and artists.</p>
    </div>

    <div class="card">
        <h2>🎬 Entertainment</h2>
        <p>Movies, celebrities and shows.</p>
    </div>

    <div class="card">
        <h2>📰 News</h2>
        <p>Breaking news from around the world.</p>
    </div>

</div>

</body>
</html>
