<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Youngvik Hub</title>

  <style>
    /* LIGHT MODE (default) */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #111;
      transition: 0.4s ease;
    }

    /* DARK MODE */
    body.dark {
      background: #121212;
      color: #ffffff;
    }

    /* NAVBAR */
    .navbar {
      background-color: #0d47a1;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      animation: slideDown 0.8s ease;
    }

    @keyframes slideDown {
      from {
        transform: translateY(-100%);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .logo {
      color: white;
      font-size: 20px;
      font-weight: bold;
    }

    .nav-links {
      display: flex;
      gap: 20px;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      position: relative;
      transition: 0.3s;
    }

    .nav-links a:hover {
      color: yellow;
      transform: scale(1.1);
    }

    /* DARK MODE TOGGLE BUTTON */
    .toggle-btn {
      background: white;
      border: none;
      padding: 8px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }

    body.dark .toggle-btn {
      background: #333;
      color: white;
    }

    /* TITLE */
    .title {
      text-align: center;
      margin-top: 30px;
      font-size: 28px;
      font-weight: bold;
      animation: fadeIn 1s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    /* CARDS */
    .card-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 30px;
      flex-wrap: wrap;
    }

    .card {
      width: 180px;
      padding: 20px;
      background: white;
      border-radius: 10px;
      text-align: center;
      font-weight: bold;
      color: #0d47a1;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      cursor: pointer;

      animation: popUp 0.8s ease forwards;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    body.dark .card {
      background: #1e1e1e;
      color: white;
    }

    .card:hover {
      transform: translateY(-10px) scale(1.05);
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    }

    @keyframes popUp {
      from { transform: translateY(40px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>

<body>

  <!-- NAVBAR -->
  <div class="navbar">
    <div class="logo">Youngvik Hub</div>

    <div class="nav-links">
      <a href="#">Home</a>
      <a href="#">Football</a>
      <a href="#">Music</a>
      <a href="#">Entertainment</a>
      <a href="#">News</a>
    </div>

    <!-- DARK MODE BUTTON -->
    <button class="toggle-btn" onclick="toggleDarkMode()">🌙 Dark</button>
  </div>

  <!-- TITLE -->
  <div class="title">Welcome to Youngvik Hub</div>

  <!-- CARDS -->
  <div class="card-container">
    <div class="card">Football Transfer</div>
    <div class="card">Music</div>
    <div class="card">Entertainment</div>
    <div class="card">News</div>
  </div>

  <!-- JAVASCRIPT -->
  <script>
    function toggleDarkMode() {
      document.body.classList.toggle("dark");
    }
  </script>

</body>
</html>
