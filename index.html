<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Youngvik Hub</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f5;
}

header{
    background:#0d47a1;
    color:white;
    padding:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

nav ul{
    list-style:none;
    display:flex;
    gap:20px;
}

nav ul li a{
    color:white;
    text-decoration:none;
    font-weight:bold;
}

.toggle-btn{
    padding:8px 15px;
    border:none;
    border-radius:20px;
    cursor:pointer;
}

.hero{
    text-align:center;
    padding:40px 20px;
}

.hero h1{
    font-size:36px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
    padding:20px;
}

.card{
    background:white;
    height:130px;
    border-radius:12px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:20px;
    font-weight:bold;
    box-shadow:0 4px 10px rgba(0,0,0,0.15);
    transition:0.3s;
    cursor:pointer;
}

.card:hover{
    transform:translateY(-5px);
}

footer{
    background:#0d47a1;
    color:white;
    text-align:center;
    padding:20px;
    margin-top:40px;
}

.dark-mode{
    background:#121212;
    color:white;
}

.dark-mode .card{
    background:#1f1f1f;
    color:white;
}
</style>
</head>

<body>

<header>
    <div class="logo">Youngvik Hub</div>

    <nav>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Football</a></li>
            <li><a href="#">Music</a></li>
            <li><a href="#">Entertainment</a></li>
            <li><a href="#">News</a></li>
        </ul>
    </nav>

    <button class="toggle-btn" onclick="toggleDarkMode()">
        🌙 Dark
    </button>
</header>

<div class="hero">
    <h1>Welcome to Youngvik Hub</h1>
</div>

<div class="cards">
    <div class="card">⚽ Football Transfer</div>
    <div class="card">🎵 Music</div>
    <div class="card">🎬 Entertainment</div>
    <div class="card">📰 News</div>
</div>

<footer>
    © 2026 Youngvik Hub
</footer>

<script>
function toggleDarkMode(){
    document.body.classList.toggle("dark-mode");
}
</script>

</body>
</html>
